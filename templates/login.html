<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Variedades Angie</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #ffd6e8 0%, #ffb3d6 50%, #ff9ec9 100%);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
        }
        body::before, body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
        }
        body::before { width: 120px; height: 120px; top: 8%; left: 12%; }
        body::after { width: 80px; height: 80px; bottom: 10%; right: 15%; }
        .login-card {
            width: 400px;
            background: #ffffff;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(216, 27, 96, 0.35);
            overflow: hidden;
            position: relative;
            z-index: 1;
        }
        .login-header {
            background: linear-gradient(135deg, #ff9ec9, #ff6bb3);
            padding: 25px 20px;
            text-align: center;
            color: #fff;
        }
        .kitty-emoji {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
            font-size: 42px;
            box-shadow: 0 5px 15px rgba(255, 107, 179, 0.4);
        }
        .login-header h4 { font-weight: 800; text-shadow: 1px 2px 3px rgba(0,0,0,0.15); }
        .login-header p { font-size: 12px; opacity: 0.95; }
        .pink-divider {
            width: 60px;
            height: 4px;
            background: #ff6bb3;
            border-radius: 10px;
            margin: 15px auto;
        }
        .form-control {
            border: 2px solid #ffd6e8;
            border-radius: 12px;
            color: #555;
            padding: 10px 14px;
        }
        .form-control:focus {
            border-color: #ff6bb3;
            box-shadow: 0 0 0 4px rgba(255, 107, 179, 0.2);
        }
        .form-label { color: #ff6bb3; font-weight: 700; font-size: 13px; }
        .btn-login {
            background: linear-gradient(135deg, #ff6bb3, #ff9ec9);
            border: none;
            color: #fff;
            font-weight: 700;
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 6px 15px rgba(255, 107, 179, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(255, 107, 179, 0.5); color: #fff; }
        .alert-danger {
            background: #ffe3ef;
            border: 1px solid #ff9ec9;
            color: #d81b60;
            border-radius: 12px;
            font-size: 13px;
        }
        .hint { font-size: 11px; color: #d9a5c0; }
        .hint b { color: #ff6bb3; }
        .kitty-dot { color: #ff6bb3; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <div class="kitty-emoji"><i class="fas fa-user fa-2x" style="color:#ff6bb3;"></i></div>
            <h4 class="mb-0">Variedades Angie</h4>
            <p class="small mb-0">Acceso Administradores, Dueños y Trabajadores</p>
        </div>
        <div class="p-4">
            <div class="pink-divider"></div>
            {% if error %}
            <div class="alert alert-danger py-2 small mb-3">
                <i class="fas fa-exclamation-circle me-1"></i>{{ error }}
            </div>
            {% endif %}
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label small">👤 Usuario</label>
                    <input type="text" name="username" class="form-control form-control-sm" placeholder="Ej. admin o trabajador" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small">🔒 Contraseña</label>
                    <input type="password" name="password" class="form-control form-control-sm" placeholder="********" required>
                </div>
                <button type="submit" class="btn btn-login w-100 mt-2">
                    <i class="fas fa-heart me-2"></i>Ingresar al Sistema
                </button>
            </form>
        </div>
    </div>
</body>
</html>
